# Releases scheduled articles. Every 15 minutes it looks for posts whose publishAt has passed,
# drops publishAt (a normal commit, so Vercel rebuilds the site), then notifies app readers.
# GitHub may start scheduled runs a few minutes late; posts go live within ~20 minutes of their time.
name: Release scheduled articles

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-schedule
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release due posts
        id: release
        run: |
          slugs=$(npx tsx scripts/blog-automation.ts release | tr '\n' ' ')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.release.outputs.slugs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/blog/posts
          git commit -m "blog: publish scheduled ${{ steps.release.outputs.slugs }}"
          git push
      # Commits made with GITHUB_TOKEN don't trigger other workflows, so notify here
      - name: Notify app readers
        if: steps.release.outputs.slugs != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/blog-automation.ts notify ${{ steps.release.outputs.slugs }}
