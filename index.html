<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..900&family=Inter:wght@400;600;800;900&family=DM+Mono:wght@400;500&family=Gloria+Hallelujah&display=swap"
    />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM summary" />
    <!-- Page-specific title, description, canonical, social and structured-data tags are added per page at build time (scripts/prerender.mjs) -->
    <meta
      name="description"
      content="Vaibhav Pasi is a digital marketing strategist, software developer and AI consultant, and Co-Founder of 4AM Global Media, helping brands scale with growth marketing, AI and e-commerce."
    />
    <title>Vaibhav Pasi | Tech x Marketing</title>

    <!-- Intro splash: shown once per browser session, skipped for reduced motion. Removed by src/splash.ts -->
    <script>
      try {
        if (sessionStorage.getItem('vp-splash') || matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('no-splash');
        }
      } catch (e) {}
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 24px;
        background-color: #f4efe6;
        background-image:
          linear-gradient(to right, rgba(1, 44, 235, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(1, 44, 235, 0.07) 1px, transparent 1px);
        background-size: 40px 40px;
        color: #051024;
        font-family: 'Inter', system-ui, sans-serif;
        transition: transform 0.9s cubic-bezier(0.76, 0, 0.24, 1);
        /* Failsafe: hides itself even if the app's JavaScript never runs */
        animation: splash-failsafe 0.6s ease 5s forwards;
      }
      .no-splash #splash { display: none; }
      #splash.exit { transform: translateY(-100%); }
      @property --pct { syntax: '<integer>'; initial-value: 0; inherits: false; }
      .splash-pct {
        font: 900 clamp(64px, 18vw, 180px) / 0.9 'Inter', system-ui, sans-serif;
        letter-spacing: -0.06em;
        color: #012ceb;
        counter-reset: pct var(--pct);
        animation: splash-count 1.6s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards;
        font-variant-numeric: tabular-nums;
      }
      .splash-pct::after { content: counter(pct, decimal-leading-zero) '%'; }
      .splash-bar {
        width: min(340px, 70vw);
        height: 14px;
        border: 2px solid #051024;
        box-shadow: 4px 4px 0 #051024;
        background: #f4efe6;
        overflow: hidden;
      }
      .splash-bar i {
        display: block;
        height: 100%;
        background: #012ceb;
        transform: scaleX(0);
        transform-origin: left;
        animation: splash-load 1.6s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards;
      }
      .splash-note {
        max-width: 22ch;
        text-align: center;
        font: 400 clamp(18px, 4vw, 26px) / 1.3 'Gloria Hallelujah', cursive;
        transform: rotate(-2deg);
        opacity: 0;
        animation: splash-fade 0.7s ease 0.6s forwards;
      }
      .splash-note b { color: #012ceb; font-weight: 400; }
      .splash-tag {
        font: 500 11px 'DM Mono', ui-monospace, monospace;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      @keyframes splash-count { to { --pct: 100; } }
      @keyframes splash-load { to { transform: scaleX(1); } }
      @keyframes splash-fade { to { opacity: 1; } }
      @keyframes splash-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #splash { display: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-tag">SYS.BOOT // VOL.2026</div>
      <div class="splash-pct"></div>
      <div class="splash-bar"><i></i></div>
      <div class="splash-note">Marketing by day. <b>Shipping code by 4AM.</b></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
