<html lang="en" data-theme="dark">

    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#070b18" />

        var t = localStorage.getItem('vp-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
